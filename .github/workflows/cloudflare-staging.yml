name: Cloudflare staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    env:
      CLOUDFLARE_ACCOUNT_ID: f14987cb2f1db42ebfde241a23700328
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: docker/setup-buildx-action@v3
      - run: pnpm --dir backend install --frozen-lockfile
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir backend build
      - run: pnpm --dir frontend build
      - run: pnpm --dir backend test
      - run: pnpm --dir backend/packages/cloudflare test:security
      - name: Validate staging configuration
        run: pnpm --dir backend/packages/cloudflare exec tsx scripts/check-deployment.ts
        env:
          MIRIAD_ACCESS_TEAM_DOMAIN: ${{ vars.MIRIAD_ACCESS_TEAM_DOMAIN }}
          MIRIAD_ACCESS_AUD: ${{ vars.MIRIAD_ACCESS_AUD }}
          MIRIAD_RUNTIME_ORIGIN: ${{ vars.MIRIAD_RUNTIME_ORIGIN }}
          MIRIAD_HYPERDRIVE_ID: ${{ vars.MIRIAD_HYPERDRIVE_ID }}
          MIRIAD_APP_ORIGIN: ${{ vars.MIRIAD_APP_ORIGIN }}
          MIRIAD_PREVIEW_DOMAIN: ${{ vars.MIRIAD_PREVIEW_DOMAIN }}
          MIRIAD_PREVIEW_ZONE_ID: ${{ vars.MIRIAD_PREVIEW_ZONE_ID }}
      - name: Verify homelab schema was applied for this build
        run: pnpm --dir backend/packages/cloudflare check:schema
        env:
          MIRIAD_SCHEMA_SHA256: ${{ vars.MIRIAD_SCHEMA_SHA256 }}
      - name: Configure Worker secrets
        run: pnpm --dir backend/packages/cloudflare exec node scripts/configure-secrets.mjs
        env:
          MIRIAD_WORKER_SECRETS: ${{ secrets.MIRIAD_WORKER_SECRETS }}
      - name: Deploy Worker and Sandbox image
        run: pnpm --dir backend/packages/cloudflare exec wrangler deploy --config wrangler.staging.generated.json
      - name: Record deployment
        run: pnpm --dir backend/packages/cloudflare exec wrangler deployments list
